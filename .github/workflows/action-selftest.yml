# Self-test of the GitHub Action (action.yml) against the probe tests' mock OpenAI-compatible
# server (tests/probe/conftest.py, started by scripts/probe_mock_server.py). No model and no
# real endpoint: the mock serves hand-written canned answers.
name: action-selftest

on:
  pull_request:
    paths:
      - action.yml
      - scripts/probe_summary.py
      - scripts/probe_mock_server.py
      - tests/probe/conftest.py
      - src/canitoolcall/probe.py
      - src/canitoolcall/cli.py
      - .github/workflows/action-selftest.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - scripts/probe_summary.py
      - scripts/probe_mock_server.py
      - tests/probe/conftest.py
      - src/canitoolcall/probe.py
      - src/canitoolcall/cli.py
      - .github/workflows/action-selftest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  selftest:
    name: action against the mock server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync

      - name: start the mock servers
        env:
          MOCK_EXPECTED_KEY: selftest-not-a-secret
        run: |
          nohup uv run python scripts/probe_mock_server.py --port 8011 --require-key-env MOCK_EXPECTED_KEY \
            > "$RUNNER_TEMP/mock-good.log" 2>&1 &
          nohup uv run python scripts/probe_mock_server.py --port 8012 --omit-index parallel-calls \
            > "$RUNNER_TEMP/mock-broken.log" 2>&1 &
          for log in mock-good mock-broken; do
            for _ in $(seq 100); do grep -q listening "$RUNNER_TEMP/$log.log" && break; sleep 0.2; done
            cat "$RUNNER_TEMP/$log.log"
            grep -q listening "$RUNNER_TEMP/$log.log"
          done

      # The released probe against the mock from this checkout: a pull request that changes the mock
      # could fail here through no fault of its own, so this step runs on main and on demand only.
      - name: passing server, default (released) version
        id: released
        if: github.event_name != 'pull_request'
        uses: ./
        env:
          SELFTEST_KEY: selftest-not-a-secret
        with:
          base-url: http://127.0.0.1:8011/v1
          model: mock-model
          api-key-env: SELFTEST_KEY
          json-report: selftest-released.json
          artifact-name: selftest-released

      - name: passing server, this checkout
        id: checkout
        uses: ./
        env:
          SELFTEST_KEY: selftest-not-a-secret
        with:
          base-url: http://127.0.0.1:8011/v1
          model: mock-model
          api-key-env: SELFTEST_KEY
          package: ${{ github.workspace }}
          json-report: selftest-checkout.json
          artifact-name: selftest-checkout

      - name: failing server (expected to fail)
        id: broken
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:8012/v1
          model: mock-model
          args: --concurrency 2
          package: ${{ github.workspace }}
          json-report: selftest-broken.json
          artifact-name: selftest-broken

      - name: invalid api-key-env (expected to fail)
        id: badname
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:8011/v1
          model: mock-model
          api-key-env: not a variable name
          artifact-name: ""

      - name: leave a passing report where the next step writes its own
        run: cp selftest-checkout.json selftest-stale.json

      - name: unreachable endpoint over an old report (expected to fail)
        id: unreachable
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:8013/v1
          model: mock-model
          package: ${{ github.workspace }}
          json-report: selftest-stale.json
          artifact-name: ""

      - name: check outcomes and exit codes
        env:
          EVENT: ${{ github.event_name }}
          RELEASED_RC: ${{ steps.released.outputs.exit-code }}
          CHECKOUT_RC: ${{ steps.checkout.outputs.exit-code }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_RC: ${{ steps.broken.outputs.exit-code }}
          BADNAME_OUTCOME: ${{ steps.badname.outcome }}
          BADNAME_RC: ${{ steps.badname.outputs.exit-code }}
          UNREACHABLE_OUTCOME: ${{ steps.unreachable.outcome }}
          UNREACHABLE_RC: ${{ steps.unreachable.outputs.exit-code }}
        run: |
          set -x
          if [[ "$EVENT" != pull_request ]]; then
            test "$RELEASED_RC" = 0
            jq -e '.summary.fail == 0 and .summary.error == 0' selftest-released.json
          fi
          test "$CHECKOUT_RC" = 0
          test "$BROKEN_OUTCOME" = failure
          test "$BROKEN_RC" = 1
          test "$BADNAME_OUTCOME" = failure
          test "$BADNAME_RC" = 2
          test "$UNREACHABLE_OUTCOME" = failure
          test "$UNREACHABLE_RC" = 2
          # The old report is gone, so it was neither summarised nor uploaded as this step's result
          # (tests/probe/test_github_action.py checks that the summary then says "no report").
          test ! -e selftest-stale.json
          jq -e '.summary.fail == 0 and .summary.error == 0' selftest-checkout.json
          jq -e '.summary.fail == 1 and .summary.error == 0' selftest-broken.json
          jq -e 'any(.outcomes[]; .scenario_id == "parallel-calls" and .stream and .check == "scenario" and .status == "fail")' \
            selftest-broken.json
